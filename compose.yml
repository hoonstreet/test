services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: isahaedream
      POSTGRES_USER: isahaedream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isahaedream -d isahaedream"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.75
    networks: [app_internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/isahaedream
      DB_USERNAME: isahaedream
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      BASE_URL: ${BASE_URL:-http://15.164.87.34}
      SEARCH_INDEX_ENABLED: ${SEARCH_INDEX_ENABLED:-false}
      THYMELEAF_CACHE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    cpus: 1.25
    networks: [app_internal]

networks:
  app_internal:
    driver: bridge

volumes:
  postgres_data:

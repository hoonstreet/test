<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">지역 안내</title>
    <meta name="description" th:content="${pageDescription}">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta property="og:type" content="website"><meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${pageDescription}"><meta property="og:image" th:content="${ogImageUrl}">
    <meta property="og:image:alt" th:content="|${region.name} 포장이사 이미지|"><meta property="og:locale" content="ko_KR">
    <meta property="og:image:width" content="1000"><meta property="og:image:height" content="1000">
    <meta property="og:url" th:content="${canonicalUrl}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" th:content="${ogImageUrl}">
    <meta th:if="${!#strings.isEmpty(site.naverSiteVerification)}" name="naver-site-verification" th:content="${site.naverSiteVerification}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="canonical" th:href="${canonicalUrl}">
    <link rel="stylesheet" href="/css/site.css?v=20261027-1">
    <script src="/js/site.js?v=20261025-2" defer></script>
    <script type="application/ld+json" th:utext="${structuredDataJson}"></script>
</head>
<body>
<div class="page-shell">
    <header th:replace="~{fragments/site :: header}"></header>
    <main>
        <section class="sub-hero">
            <a href="/">홈</a><span>/</span><strong th:text="${region.name}">중랑구</strong>
            <h1><em th:text="${region.name}">중랑구</em> 포장이사·보관이사·입주이사</h1>
            <p>서비스 종류와 가까운 동을 선택하면 상세 상담 안내를 확인할 수 있습니다.</p>
        </section>
        <section class="section-block">
            <div class="section-heading"><div><span class="eyebrow">SERVICES</span><h2>이사 서비스</h2></div></div>
            <div class="service-carousel search-service-gallery">
                <div class="service-grid compact">
                    <a class="bento service-card search-service-card" th:each="service, stat : ${services}" th:href="|#${service.slug}|">
                        <div class="service-image-wrap">
                            <img class="service-image" th:src="|/images/services/${service.slug}.webp|" th:alt="|${region.name} ${service.name}|" width="1000" height="1000" loading="eager" th:attr="fetchpriority=${stat.first ? 'high' : null}">
                        </div>
                        <h3 th:text="|${region.name} ${service.name}|"></h3><p th:text="${service.shortDescription}"></p><span>핵심 안내 보기 →</span>
                    </a>
                </div>
            </div>
        </section>
        <section class="section-block service-guide-list" aria-label="지역별 이사 서비스 안내">
            <article class="service-guide" th:each="service, stat : ${services}" th:id="${service.slug}">
                <div class="service-guide-number" th:text="${#numbers.formatInteger(stat.count, 2)}">01</div>
                <div>
                    <span class="eyebrow">MOVING SERVICE GUIDE</span>
                    <h2 th:text="|${region.name} ${service.name}|">중랑구 포장이사</h2>
                    <p th:text="|${region.name}에서 ${service.name}를 준비할 때는 짐량, 건물 동선, 차량 접근과 작업 범위를 먼저 확인하는 것이 좋습니다. ${service.shortDescription}|"></p>
                    <a class="text-link" th:href="|/regions/${region.slug}/${service.slug}|" th:text="|${region.name} ${service.name} 상세 안내 보기 →|"></a>
                </div>
            </article>
        </section>
        <section class="section-block soft-panel">
            <div class="section-heading"><div><span class="eyebrow">NEIGHBORHOODS</span><h2>상세 지역</h2></div></div>
            <div class="neighborhood-grid">
                <div class="neighborhood-card" th:each="neighborhood : ${neighborhoods}">
                    <a class="neighborhood-title" th:href="|/regions/${region.slug}/${neighborhood.slug}|" th:text="${neighborhood.name}"></a>
                    <div><a th:each="service : ${services}" th:href="|/regions/${region.slug}/${neighborhood.slug}/${service.slug}|" th:text="${service.name}"></a></div>
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
</div>
<div th:replace="~{fragments/site :: mobileActions}"></div>
</body>
</html>

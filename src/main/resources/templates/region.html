<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">지역 안내</title>
    <meta name="description" th:content="${pageDescription}">
    <meta name="robots" content="max-image-preview:large">
    <meta property="og:type" content="website"><meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${pageDescription}"><meta property="og:image" th:content="${ogImageUrl}">
    <meta property="og:image:width" content="1200"><meta property="og:image:height" content="750">
    <meta property="og:url" th:content="${canonicalUrl}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" th:content="${ogImageUrl}">
    <meta th:if="${!#strings.isEmpty(site.naverSiteVerification)}" name="naver-site-verification" th:content="${site.naverSiteVerification}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="canonical" th:href="${canonicalUrl}">
    <link rel="stylesheet" href="/css/site.css?v=20261025-1">
    <script src="/js/site.js?v=20261025-1" defer></script>
    <script type="application/ld+json" th:utext="${structuredDataJson}"></script>
</head>
<body>
<div class="page-shell">
    <header th:replace="~{fragments/site :: header}"></header>
    <main>
        <section class="sub-hero">
            <a href="/">홈</a><span>/</span><strong th:text="${region.name}">중랑구</strong>
            <h1><em th:text="${region.name}">중랑구</em> 이사 서비스</h1>
            <p>서비스 종류와 가까운 동을 선택하면 상세 상담 안내를 확인할 수 있습니다.</p>
        </section>
        <section class="section-block">
            <div class="section-heading"><div><span class="eyebrow">SERVICES</span><h2>이사 서비스</h2></div></div>
            <div class="service-carousel" data-service-carousel>
                <button class="carousel-button previous" type="button" aria-label="이전 이사 서비스" data-carousel-previous>‹</button>
                <div class="service-grid compact" data-carousel-track>
                    <a class="bento service-card" th:each="service : ${services}" th:href="|/regions/${region.slug}/${service.slug}|">
                        <div class="service-image-wrap">
                            <img class="service-image" th:src="|/images/services/${service.slug}.webp|" th:alt="|${region.name} ${service.name} 작업 이미지|" width="1200" height="750" loading="lazy">
                        </div>
                        <h3 th:text="${service.name}"></h3><p th:text="${service.shortDescription}"></p><span>상세 보기 →</span>
                    </a>
                </div>
                <button class="carousel-button next" type="button" aria-label="다음 이사 서비스" data-carousel-next>›</button>
            </div>
        </section>
        <section class="section-block soft-panel">
            <div class="section-heading"><div><span class="eyebrow">NEIGHBORHOODS</span><h2>상세 지역</h2></div></div>
            <div class="neighborhood-grid">
                <div class="neighborhood-card" th:each="neighborhood : ${neighborhoods}">
                    <a class="neighborhood-title" th:href="|/regions/${region.slug}/${neighborhood.slug}|" th:text="${neighborhood.name}"></a>
                    <div><a th:each="service : ${services}" th:href="|/regions/${region.slug}/${neighborhood.slug}/${service.slug}|" th:text="${service.name}"></a></div>
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
</div>
<div th:replace="~{fragments/site :: mobileActions}"></div>
</body>
</html>

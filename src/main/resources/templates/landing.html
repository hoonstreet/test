<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${content.title}">지역 이사</title>
    <meta name="description" th:content="${content.description}">
    <meta th:if="${!#strings.isEmpty(site.naverSiteVerification)}" name="naver-site-verification" th:content="${site.naverSiteVerification}">
    <meta name="robots" th:content="${content.customPublished} ? 'index,follow,max-image-preview:large' : 'noindex,follow,max-image-preview:large'">
    <th:block th:if="${ogImageUrl != null}">
        <meta property="og:type" content="website"><meta property="og:title" th:content="${content.title}">
        <meta property="og:description" th:content="${content.description}"><meta property="og:image" th:content="${ogImageUrl}">
        <meta property="og:image:alt" th:content="|${region.name} ${neighborhood != null ? neighborhood.name + ' ' : ''}${movingService.name}|"><meta property="og:locale" content="ko_KR">
        <meta property="og:image:width" content="1000"><meta property="og:image:height" content="1000">
        <meta property="og:url" th:content="${canonicalUrl}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" th:content="${ogImageUrl}">
    </th:block>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="canonical" th:href="${canonicalUrl}">
    <link rel="stylesheet" href="/css/site.css?v=20261024-1">
    <script th:if="${structuredDataJson != null}" type="application/ld+json" th:utext="${structuredDataJson}"></script>
</head>
<body>
<div class="preview-banner" th:if="${adminPreview}">관리자 초안 미리보기 · 이 내용은 아직 검색과 일반 방문자에게 공개되지 않습니다.</div>
<div class="page-shell">
    <header th:replace="~{fragments/site :: header}"></header>
    <main>
        <section class="landing-hero">
            <div class="breadcrumb">
                <a href="/">홈</a><span>/</span><a th:href="|/regions/${region.slug}|" th:text="${region.name}"></a>
                <th:block th:if="${neighborhood != null}"><span>/</span><a th:href="|/regions/${region.slug}/${neighborhood.slug}|" th:text="${neighborhood.name}"></a></th:block>
                <span>/</span><strong th:text="${movingService.name}"></strong>
            </div>
            <div class="landing-grid">
                <article>
                    <span class="eyebrow" th:text="${movingService.name}">포장이사</span>
                    <h1 th:text="${content.headline}">지역 포장이사, 이사해드림</h1>
                    <p th:text="${content.introduction}"></p>
                    <div class="hero-actions">
                        <a class="button primary" th:href="|tel:${site.phoneHref}|">전화 상담</a>
                        <a class="button kakao" th:href="${site.kakaoUrl}" target="_blank" rel="noopener">카카오톡</a>
                    </div>
                </article>
                <aside class="landing-aside">
                    <figure class="bento landing-media">
                        <img th:src="|/images/services/${movingService.slug}.webp|" th:alt="|${region.name} ${neighborhood != null ? neighborhood.name + ' ' : ''}${movingService.name}|" width="1000" height="1000" loading="eager" fetchpriority="high">
                    </figure>
                    <div class="bento consultation-card">
                        <span>상담 전 알려주세요</span>
                        <ul><li>희망 이사 날짜</li><li>출발지와 도착지</li><li>짐의 대략적인 양</li><li>엘리베이터·주차 여부</li></ul>
                    </div>
                </aside>
            </div>
        </section>
        <section class="content-layout section-block">
            <article class="content-copy">
                <span class="eyebrow">LOCAL GUIDE</span>
                <h2 th:text="|${neighborhood != null ? neighborhood.name : region.name} ${movingService.name} 안내|">지역 안내</h2>
                <div class="prose" th:text="${content.body}"></div>
            </article>
            <aside class="side-links">
                <h3 th:text="|${neighborhood != null ? neighborhood.name : region.name} 다른 서비스|">다른 서비스</h3>
                <a th:if="${neighborhood != null}" th:each="item : ${services}"
                   th:href="|/regions/${region.slug}/${neighborhood.slug}/${item.slug}|"
                   th:text="${item.name}"></a>
                <a th:if="${neighborhood == null}" th:each="item : ${services}"
                   th:href="|/regions/${region.slug}/${item.slug}|"
                   th:text="${item.name}"></a>
            </aside>
        </section>
        <section class="section-block nearby-panel" th:if="${neighborhood != null}">
            <div class="section-heading"><div><span class="eyebrow">NEARBY ROUTES</span><h2 th:text="|${region.name} 다른 지역|">주변 지역</h2></div><p>같은 지역의 동별 이사 안내를 이어서 확인하세요.</p></div>
            <div class="route-links">
                <a th:each="item : ${neighborhoods}" th:if="${item.id != neighborhood.id}"
                   th:href="|/regions/${region.slug}/${item.slug}/${movingService.slug}|"
                   th:text="|${item.name} ${movingService.name}|"></a>
            </div>
        </section>
        <section class="final-cta compact-cta"><h2>일정과 지역을 알려주시면<br>상담을 도와드릴게요</h2><a class="button white" th:href="|tel:${site.phoneHref}|" th:text="${site.phoneDisplay}"></a></section>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
</div>
<div th:replace="~{fragments/site :: mobileActions}"></div>
</body>
</html>

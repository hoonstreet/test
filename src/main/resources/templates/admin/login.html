<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 로그인 | 이사해드림</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/site.css"></head>
<body class="admin-body">
<main class="login-card">
    <img src="/images/logo.svg" alt="이사해드림">
    <span class="eyebrow">ADMIN</span><h1>관리자 로그인</h1>
    <p>지역별 페이지와 상담 정보를 관리합니다.</p>
    <div class="alert error" th:if="${param.error}">아이디 또는 비밀번호를 확인하세요.</div>
    <div class="alert" th:if="${param.logout}">안전하게 로그아웃했습니다.</div>
    <form method="post" th:action="@{/admin/login}">
        <label>아이디<input name="username" autocomplete="username" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">로그인</button>
    </form>
    <a class="text-link" href="/">홈페이지로 돌아가기</a>
</main>
</body>
</html>
